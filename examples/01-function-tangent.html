<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>函数图像与切线</title>
<style>
  :root{
    --color-background-primary:#ffffff; --color-text-primary:#1a1a19;
    --font-sans:system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-serif:Georgia,"Times New Roman",serif;
  }
  body{margin:0;padding:28px 20px;background:#fff;color:#1a1a19;font-family:var(--font-sans)}
  figure{max-width:680px;margin:0 auto}
  figcaption{font-size:13px;color:#5F5E5A;line-height:1.7;margin-top:12px}
  code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#F1EFE8;padding:1px 5px;border-radius:3px}
</style>
</head>
<body>
<figure>
  <div id="fig"></div>
  <figcaption>
    三次函数 <code>y = x³ − 3x</code> 的图像。导数为零处给出极值点 (−1, 2) 与 (1, −2)；
    虚线是 <code>x = 1.5</code> 处的切线，斜率等于该点的导数 <code>f′(1.5) = 3.75</code>。
  </figcaption>
</figure>

<script src="../skill/assets/mk-core.js"></script>
<script>
var V = MK.frame({
  box: [40, 26, 600, 336],
  x: [-3.1, 3.1],
  y: [-4.6, 4.6],
  equal: false,
  grid: true,
  axes: true,
  title: "三次函数与其切线",
  desc: "y = x³ − 3x，极值点，以及 x = 1.5 处的切线"
});
document.getElementById("fig").appendChild(V.svg);

var f = function (x) { return x * x * x - 3 * x; };
var df = function (x) { return 3 * x * x - 3; };

V.plot(f, { color: "blue", w: 2.2, n: 520 });

var x0 = 1.5, y0 = f(x0), k = df(x0);
V.plot(function (x) { return k * (x - x0) + y0; }, {
  color: "coral", w: 1.6, dash: "6 4"
});

V.dot([-1, 2], { color: "teal", r: 4 });
V.label([-1, 2], "极大值 (−1, 2)", { dx: -13, dy: -12, color: "teal", anchor: "end", size: 12 });
V.dot([1, -2], { color: "teal", r: 4 });
V.label([1, -2], "极小值 (1, −2)", { dx: 12, dy: 16, color: "teal", size: 12 });

V.seg([x0, y0], [x0 + 1, y0], { dash: true, color: "gray", w: 1.2 });
V.seg([x0 + 1, y0], [x0 + 1, y0 + k], { dash: true, color: "gray", w: 1.2 });
V.label([x0 + 0.5, y0 - 0.34], "1", { anchor: "middle", size: 11, color: "gray" });
V.label([x0 + 1.12, y0 + k * 0.56], "f′(x₀)=3.75", { size: 11, color: "gray", anchor: "end" });

V.dot([x0, y0], { color: "coral", r: 4.5 });
V.label([x0, y0], "P(1.5, −1.125)", { dx: -12, dy: 20, color: "coral", size: 12, anchor: "end" });

V.legend([
  { text: "y = x³ − 3x", color: "blue" },
  { text: "x = 1.5 处切线", color: "coral", dash: true },
  { text: "极值点", color: "teal" }
], { x: 412, y: 62 });
</script>
</body>
</html>
