<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>确定性有限自动机</title>
<style>
  :root{
    --color-background-primary:#ffffff; --color-text-primary:#1a1a19;
    --font-sans:system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-serif:Georgia,"Times New Roman",serif;
  }
  body{margin:0;padding:28px 20px;background:#fff;color:#1a1a19;font-family:var(--font-sans)}
  figure{max-width:680px;margin:0 auto}
  figcaption{font-size:13px;color:#5F5E5A;line-height:1.7;margin-top:12px}
  code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#F1EFE8;padding:1px 5px;border-radius:3px}
</style>
</head>
<body>
<figure>
  <div id="fig"></div>
  <figcaption>
    接受「含偶数个 0」的 DFA。<code>q₀</code> 为起始态，<code>q₁</code> 为接受态（双圈）。
    读入 0 时两个状态互换，读入 1 时保持不动。
  </figcaption>
</figure>

<script src="../skill/assets/mk-core.js"></script>
<script src="../skill/assets/mk-graph.js"></script>
<script>
var G = MK.graph({
  box: [60, 88, 560, 196],
  directed: true,
  nodes: [
    { id: "q0", label: "q₀", color: "blue", r: 32, x: 250, y: 196, fixed: true },
    { id: "q1", label: "q₁", color: "teal", accept: true, r: 32, x: 460, y: 196, fixed: true }
  ],
  edges: [
    ["q0", "q1", "0"],
    ["q1", "q0", "0"],
    ["q0", "q0", "1"],
    ["q1", "q1", "1"]
  ],
  title: "偶数个 0 的 DFA",
  desc: "两个状态 q0 q1，读入 0 切换，读入 1 保持"
});
document.getElementById("fig").appendChild(G.svg);
G.draw();

var n0 = G.nodes[G.ix["q0"]];
var g = MK.mk("g", null, G.svg);
MK.mk("line", {
  x1: n0.x - 78, y1: n0.y, x2: n0.x - 39, y2: n0.y,
  stroke: MK.ink(), "stroke-width": 1.5
}, g);
MK.mk("path", {
  d: "M" + (n0.x - 37) + " " + n0.y + " l-9 -4.5 v9 z",
  fill: MK.ink(), stroke: "none"
}, g);
MK.txt(g, n0.x - 86, n0.y + 4, "start", { size: 11, fill: MK.ink(), anchor: "end" });

MK.txt(G.svg, 60, 288, "读入 0：两个状态互换　　读入 1：停留在原状态", {
  size: 12, fill: MK.ink()
});
</script>
</body>
</html>
