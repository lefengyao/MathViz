</style>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var dark = q.get('theme') === 'dark';
  var r = document.documentElement;
  r.setAttribute('data-theme', dark ? 'dark' : 'light');
  r.style.setProperty('--color-background-primary', dark ? '#1f1f1e' : '#ffffff');
  r.style.setProperty('--color-text-primary', dark ? '#f1efe8' : '#1a1a19');
  r.style.setProperty('--font-sans', 'system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif');
  r.style.setProperty('--font-serif', 'Georgia, "Times New Roman", serif');
})();
</script>
