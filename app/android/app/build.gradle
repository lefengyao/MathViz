plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mathviz.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.mathviz.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
